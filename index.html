<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Sonhos — Vision board de metas de surf | ASF</title><meta name="description" content="Vision board de metas e sonhos de surf: escreva seus objetivos, acompanhe e celebre cada conquista. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-sonhos/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--u),var(--p));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.row{display:flex;gap:8px;margin-bottom:14px}input{flex:1;padding:11px;border:2px solid var(--p);border-radius:10px;font-size:15px}button.add{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;border:0;padding:0 18px;border-radius:10px;font-weight:800;font-size:18px;cursor:pointer}.sonho{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(14,36,57,.06);display:flex;gap:10px;align-items:center;font-size:15px}.sonho input{width:auto;accent-color:var(--p)}.sonho.done span{text-decoration:line-through;opacity:.55}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-sonhos/">🌠 Sonhos</a><a href="https://acarolmourad-commits.github.io/asf-desafio/">📈 Desafio 30</a><a href="https://acarolmourad-commits.github.io/asf-diario/">📓 Diário</a><a href="https://acarolmourad-commits.github.io/asf-manobras/">⚡ Manobras</a></nav><header><h1>🌠 Quadro de sonhos</h1><p>Escreva suas metas de surf — do primeiro drop àquela surf trip.</p></header><main class="wrap"><div class="row"><input id="novo" placeholder="Ex.: pegar minha primeira parede verde" maxlength="80"><button class="add" onclick="add()">+</button></div><div id="lista"></div><p class="muted">Sonhos ficam salvos no seu navegador. Quebre metas grandes em passos com o <a href="https://acarolmourad-commits.github.io/asf-desafio/" style="color:var(--p)">Desafio 30</a> e registre a jornada no <a href="https://acarolmourad-commits.github.io/asf-diario/" style="color:var(--p)">Diário</a>.</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const K='asf-sonhos-v1';let d=JSON.parse(localStorage.getItem(K)||'[]');function render(){const l=document.getElementById('lista');l.innerHTML='';d.forEach((s,i)=>l.insertAdjacentHTML('beforeend',`<div class="sonho ${s.ok?'done':''}"><input type="checkbox" ${s.ok?'checked':''} data-i="${i}"><span>${s.t}</span></div>`));}function add(){const v=document.getElementById('novo').value.trim();if(!v)return;d.push({t:v,ok:false});localStorage.setItem(K,JSON.stringify(d));document.getElementById('novo').value='';render();}document.getElementById('lista').onchange=e=>{d[e.target.dataset.i].ok=e.target.checked;localStorage.setItem(K,JSON.stringify(d));render();};render();</script></body></html>
